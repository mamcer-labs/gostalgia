name: Release Process

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/mamcer-labs/gostalgia-api

jobs:
  lint:
    runs-on: [self-hosted, nuc]
    steps:
      - uses: actions/checkout@v6

      # cache: false — el backend de actions/cache falla auth en este runner
      # self-hosted, y GOMODCACHE/GOCACHE ya persisten solos en el disco de
      # rathma entre corridas, así que el cache remoto no aporta nada.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Formato (gofmt)
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Archivos sin formatear:"
            echo "$fmt_out"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5

  test:
    runs-on: [self-hosted, nuc]
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./... -race -cover

  build-and-push:
    runs-on: [self-hosted, nuc]
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imagen API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          # cache local en disco: el builder de Buildx es efímero en cada
          # corrida, así que sin esto el cache de capas arranca frío siempre
          # aunque el runner sea el mismo disco persistente.
          cache-from: type=local,src=/home/mario/actions-runner/_work/_buildx-cache
          cache-to: type=local,dest=/home/mario/actions-runner/_work/_buildx-cache,mode=max

  deploy-dev:
    runs-on: [self-hosted, nuc]
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a fury-dev
        run: pmf deploy gostalgia-api ${{ github.sha }} dev
